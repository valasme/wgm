name: Release

on:
  push:
    branches: [main]
  # Publishing is the one step with nothing to retry it. `release_created` is true
  # exactly once per version, so a build that fails after the tag exists leaves a
  # published release with no assets and no way back. This rebuilds an existing tag
  # and uploads over whatever is there.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload assets for, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Merging to main opens (or updates) a release PR with a generated CHANGELOG.
  # Merging *that* tags, and everything below runs.
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build and publish
    needs: release-please
    # `always()` because a manual run skips release-please entirely, and a skipped
    # dependency would otherwise skip this too.
    if: ${{ always() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
    steps:
      # The tag rather than the branch: the artifacts must be built from the commit
      # the release actually points at, which on a manual retry is not main's tip.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every later step names artifacts by version, and the tag is the only thing
      # both entry points agree on. Derive it once.
      - name: Resolve the version
        shell: pwsh
        run: |
          $version = "$env:TAG" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "No tag to build: TAG was '$env:TAG'."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # NSIS only. Per-user and no administrator rights, which matters more than usual
      # for an app Windows will already be warning about.
      - name: Build
        run: pnpm tauri build

      # `targets: ["nsis"]` produces no zip, so the portable artifact is assembled
      # explicitly — with the wgm.portable marker that switches the data directory to
      # ./data beside the executable.
      - name: Assemble the portable zip
        shell: pwsh
        run: |
          $staging = "portable/wgm"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src-tauri/target/release/wgm.exe" $staging
          Copy-Item "LICENSE", "README.md", "THIRD-PARTY-LICENSES.md" $staging
          New-Item -ItemType File -Path "$staging/wgm.portable" | Out-Null
          Compress-Archive -Path "$staging/*" -DestinationPath "artifacts/wgm_${env:VERSION}_x64-portable.zip" -Force

      # Published as a release asset rather than bundled into the installer: users get
      # a small download, and a maintainer can symbolise a backtrace from any release
      # offline. The release profile keeps `debug = 1` precisely for this.
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts
          Copy-Item "src-tauri/target/release/wgm.pdb" "artifacts/wgm_${env:VERSION}.pdb"

      # The signing step exists and no-ops without a key. wgm is unsigned today; the
      # README explains the SmartScreen warning and points at the checksums below.
      - name: Sign
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNING_CERTIFICATE)) {
            Write-Host "No signing certificate configured; artifacts are unsigned."
          } else {
            Write-Host "Signing is configured but not yet implemented."
            exit 1
          }

      # The whole integrity story until wgm is signed, which is why every artifact gets
      # one and the README documents how to check it.
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:TAG" artifacts/* --clobber
