version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR rather than a dozen: these move together and are always reviewed
      # together.
      radix:
        patterns: ["@radix-ui/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      tauri:
        patterns: ["@tauri-apps/*"]
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "axe-core"
          - "vitest-axe"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      specta:
        patterns:
          - "specta"
          - "specta-*"
          - "tauri-specta"
    ignore:
      # **The `windows` version is dictated by tauri, not by us.** `window.hwnd()`
      # hands back tauri's `HWND`, so `src/platform/windows/` has to be compiled
      # against the same crate version; a mismatch is a hard type error —
      # "expected `HWND`, found `HWND`", with a note about multiple versions of
      # `windows` in the dependency graph.
      #
      # Ignored rather than grouped with tauri, because a group PR still bumps it on
      # its own when tauri has not moved. Bump it by hand when tauri does, in the
      # same commit.
      - dependency-name: "windows"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
