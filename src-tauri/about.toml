# Configuration for `cargo about`, which produces the crate half of
# THIRD-PARTY-LICENSES.md. See `scripts/generate-third-party-licenses.mjs`.
#
# Without this file `cargo about` has an empty allowlist and rejects every crate in
# the tree, so keep it in step with the dependencies rather than deleting it.

# wgm ships one binary, for one target. Listing the licences of crates that only
# compile on Linux would describe a thing nobody receives.
targets = ["x86_64-pc-windows-msvc"]

# Nothing here reaches a user's machine.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Order matters: `cargo about` takes the first accepted licence from an expression,
# so MIT leads and dual-licensed crates are recorded as MIT, matching wgm's own
# licence.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # File-level copyleft, and the only licence a handful of crates offer. Shipping a
    # binary is fine; the obligation is that the source of those files stays available,
    # which crates.io already satisfies.
    "MPL-2.0",
]

# wgm itself is not a third party.
[private]
ignore = true
