[package]
name = "wgm"
version = "0.1.0"
description = "An opinionated winget package manager for developers"
authors = ["Dimitris Valasellis"]
license = "MIT"
repository = "https://github.com/valasme/wgm"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wgm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Dev builds only — never enabled in a release artifact.
devtools = ["tauri/devtools"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# A panicking command must not kill the whole app.
panic = "unwind"
# Line tables only — produces a .pdb so release backtraces can be symbolised.
debug = 1
# Keep the symbol table in the exe; the .pdb ships separately as a release asset.
strip = "debuginfo"
