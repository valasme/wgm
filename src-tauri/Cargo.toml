[package]
name = "wgm"
version = "0.2.0"
description = "An opinionated winget package manager for developers"
authors = ["Dimitris Valasellis"]
license = "MIT"
repository = "https://github.com/valasme/wgm"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids a name collision with the bin target on Windows:
# https://github.com/rust-lang/cargo/issues/8519
name = "wgm_lib"
# Just an rlib. The template ships staticlib and cdylib for mobile targets, and
# wgm is Windows-only; the extra cdylib also leaves a stale wgm_lib.dll in the
# target directory that the test harness can pick up ahead of the real one.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
# Registered as a dependency, never as a plugin: the wgm Release check is made from
# Rust so the webview's CSP can forbid the network outright. See ADR-0003.
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
specta = { version = "2.0.0-rc", features = ["serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }

thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# **Must match the version tauri depends on.** `window.hwnd()` returns tauri's `HWND`,
# so `src/platform/windows/` has to be compiled against the same crate; a mismatch is a
# hard type error that reads absurdly — "expected `HWND`, found `HWND`" — with a note
# about multiple versions of `windows` in the dependency graph. Bump this only when
# tauri does, in the same commit. Dependabot is told to leave it alone.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Com",
] }

[features]
default = []
# Dev builds only — never enabled in a release artifact.
devtools = ["tauri/devtools"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# A panicking command must not kill the whole app.
panic = "unwind"
# Line tables only — produces a .pdb so release backtraces can be symbolised.
debug = 1
# Keep the symbol table in the exe; the .pdb ships separately as a release asset.
strip = "debuginfo"
