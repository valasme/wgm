# Pre-commit runs only on staged files, so it stays fast enough to leave enabled.
# CI re-runs everything over the whole tree; this hook exists to catch the obvious.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      exclude:
        - "src/routeTree.gen.ts"
        - "src/ipc/bindings.ts"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # The only place this can run. A workflow file that does not parse is not a
    # failing check — GitHub cannot read it, so the check never exists to fail.
    - name: workflows
      glob: ".github/workflows/*.{yml,yaml}"
      run: node scripts/check-workflows.mjs {staged_files}

    - name: rustfmt
      glob: "src-tauri/**/*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

    - name: clippy
      glob: "src-tauri/**/*.{rs,toml}"
      run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck

    - name: test
      run: pnpm test
